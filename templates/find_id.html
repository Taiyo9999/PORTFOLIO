<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND ID</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="frame auth_frame">
        <nav class="navigator">
            <div class="site_brand">
                <a class="site_name" href="{{ url_for('index') }}">HELLOSUNSHINE</a>
                <a class="site_name_subtitle">Taeyang Kwon</a>
            </div>
        </nav>

        <main class="auth_shell">
            <section class="auth_card">
                <p class="auth_label">ACCOUNT HELP</p>
                <h1 class="auth_title">아이디 찾기</h1>
                {% if found_username %}
                <div class="auth_message success">아이디는 {{ found_username }} 입니다.</div>
                <a class="auth_link_button" href="{{ url_for('login') }}">로그인하러 가기</a>
                {% else %}
                {% if error %}<div class="auth_message error">{{ error }}</div>{% endif %}
                <form class="auth_form" action="{{ url_for('find_id') }}" method="post">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                    <button type="submit">아이디 찾기</button>
                </form>
                {% endif %}
            </section>
        </main>
    </div>
</body>
</html>
