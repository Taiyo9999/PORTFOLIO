<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PAGE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="frame auth_frame">
        <nav class="navigator">
            <div class="site_brand">
                <a class="site_name" href="{{ url_for('index') }}">HELLOSUNSHINE</a>
                <a class="site_name_subtitle">Taeyang Kwon</a>
            </div>
        </nav>

        <main class="auth_shell">
            <section class="auth_card">
                <p class="auth_label">MY PROFILE</p>
                {% if user.profile_image %}
                <img class="profile_image" src="{{ url_for('profile_image', filename=user.profile_image) }}" alt="프로필 이미지">
                {% endif %}
                <h1 class="auth_title">{{ user.nickname or user.username }}님</h1>
                <p class="auth_text">아이디: {{ user.username }}</p>

                {% if error %}
                <div class="auth_message error">{{ error }}</div>
                {% endif %}

                <form class="auth_form" action="{{ url_for('update_profile') }}" method="post" enctype="multipart/form-data">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" name="nickname" value="{{ user.nickname or '' }}">

                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" value="{{ user.name or '' }}">

                    <label for="birthdate">생년월일</label>
                    <input type="date" id="birthdate" name="birthdate" value="{{ user.birthdate or '' }}">

                    <label for="school">학교</label>
                    <input type="text" id="school" name="school" value="{{ user.school or '' }}">

                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" value="{{ user.email or '' }}">

                    <label for="profile_image">프로필 이미지</label>
                    <input type="file" id="profile_image" name="profile_image">

                    <button type="submit">내 정보 수정</button>
                </form>

                <p class="auth_switch"><a href="{{ url_for('index') }}">홈으로 돌아가기</a></p>
            </section>
        </main>
    </div>
</body>
</html>
