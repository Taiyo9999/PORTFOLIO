<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND PASSWORD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="frame auth_frame">
        <nav class="navigator">
            <div class="site_brand">
                <a class="site_name" href="{{ url_for('index') }}">HELLOSUNSHINE</a>
                <a class="site_name_subtitle">Taeyang Kwon</a>
            </div>
        </nav>

        <main class="auth_shell">
            <section class="auth_card">
                <p class="auth_label">ACCOUNT HELP</p>
                <h1 class="auth_title">비밀번호 찾기</h1>
                {% if success %}<div class="auth_message success">{{ success }}</div>{% endif %}
                {% if error %}<div class="auth_message error">{{ error }}</div>{% endif %}
                <form class="auth_form" action="{{ url_for('find_password') }}" method="post">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="아이디">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                    <label for="new_password">새 비밀번호</label>
                    <input type="password" id="new_password" name="new_password" placeholder="새 비밀번호">
                    <label for="new_password_confirm">새 비밀번호 확인</label>
                    <input type="password" id="new_password_confirm" name="new_password_confirm" placeholder="새 비밀번호 다시 입력">
                    <button type="submit">비밀번호 변경</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
