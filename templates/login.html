<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="frame auth_frame">
        <nav class="navigator">
            <div class="site_brand">
                <a class="site_name" href="{{ url_for('index') }}">HELLOSUNSHINE</a>
                <a class="site_name_subtitle">Taeyang Kwon</a>
            </div>
        </nav>

        <main class="auth_shell">
            <section class="auth_card">
                <p class="auth_label">WELCOME BACK</p>
                <h1 class="auth_title">로그인</h1>
                <p class="auth_text">계정 기능 자리 입니다모</p>

                {% if error %}
                <div class="auth_message error">{{ error }}</div>
                {% endif %}

                <form class="auth_form" action="{{ url_for('login') }}" method="post">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="아이디 입력">

                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력">

                    <button type="submit">로그인</button>
                </form>

                <div class="auth_helper_links">
                    <a href="{{ url_for('find_id') }}">아이디 찾기</a>
                    <a href="{{ url_for('find_password') }}">비밀번호 찾기</a>
                </div>

                <p class="auth_switch">계정이 없나요? <a href="{{ url_for('signup') }}">회원가입</a></p>
            </section>
        </main>
    </div>
</body>
</html>
